<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GP Distribuciones · Pedidos</title>
<style>
  :root{
    --navy:#0f2a4a;
    --navy-2:#153a63;
    --blue:#1c6fd9;
    --blue-light:#eaf2fd;
    --paper:#f6f7fa;
    --line:#e2e6ec;
    --ink:#16202c;
    --ink-soft:#5b6675;
    --accent:#e8973a;
    --green:#25d366;
    --white:#ffffff;
    --radius:14px;
    --red-bg:#fde8e8;
    --red-border:#f8b4b4;
    --red-text:#9b1c1c;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:var(--paper);
    color:var(--ink);
    padding-bottom:96px;
    -webkit-font-smoothing:antialiased;
  }

  /* Header */
  header{
    background:linear-gradient(135deg,var(--navy) 0%,var(--navy-2) 100%);
    color:#fff;
    padding:22px 18px 22px;
    position:relative;
  }
  header h1{
    margin:0;
    font-size:1.5rem;
    letter-spacing:.2px;
    font-weight:700;
  }
  header p{
    margin:4px 0 0;
    font-size:.85rem;
    color:#c7d6ea;
  }

  .header-logo-banner{
    display:block;
    width:100%;
    height:auto;
    border-radius:12px;
    margin-top:14px;
  }

  .tinturas-banner-btn{
    display:block;
    width:100%;
    padding:0;
    margin:0;
    border:none;
    background:none;
    cursor:pointer;
    line-height:0;
  }
  .tinturas-banner-img{
    display:block;
    width:100%;
    height:auto;
  }
  .tinturas-banner-btn:active .tinturas-banner-img{
    filter:brightness(.92);
  }

  /* Modal del catálogo de colores 317 Tinturas (se muestra dentro de la misma página) */
  .tint-overlay{
    position:fixed;
    inset:0;
    background:rgba(15,20,28,.55);
    z-index:100;
    display:none;
    align-items:flex-end;
    justify-content:center;
  }
  .tint-overlay.show{display:flex;}
  .tint-modal{
    background:#0f0f0f;
    width:100%;
    max-width:640px;
    height:92vh;
    border-radius:16px 16px 0 0;
    overflow:hidden;
    display:flex;
    flex-direction:column;
    box-shadow:0 -10px 40px rgba(0,0,0,.5);
  }
  .tint-modal-header{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:12px 16px;
    background:#141414;
    color:#fff;
    font-weight:700;
    font-size:.95rem;
    border-bottom:1px solid #282828;
    flex:none;
  }
  .tint-modal-header button{
    border:none;
    background:#222;
    color:#fff;
    width:32px;
    height:32px;
    border-radius:8px;
    font-size:1rem;
    cursor:pointer;
  }
  .tint-iframe{
    flex:1;
    width:100%;
    border:none;
    background:#0f0f0f;
  }

  /* Cuadro de texto para aviso de Sin Stock */
  .stock-notice-banner {
    display: none;
    background: var(--red-bg);
    border: 1px solid var(--red-border);
    color: var(--red-text);
    padding: 10px 14px;
    border-radius: 10px;
    font-size: 0.85rem;
    font-weight: 600;
    margin-top: 12px;
    line-height: 1.4;
  }

  .search-wrap{
    position:relative;
    margin:14px 16px 0;
    z-index:5;
  }
  .search-box{
    background:#fff;
    border-radius:var(--radius);
    box-shadow:0 8px 24px rgba(15,42,74,.16);
    display:flex;
    align-items:center;
    padding:4px 6px 4px 16px;
    border:1px solid var(--line);
  }
  .search-box svg{flex:none;color:var(--ink-soft);}
  .search-box input{
    flex:1;
    border:none;
    outline:none;
    padding:13px 10px;
    font-size:1rem;
    background:transparent;
    color:var(--ink);
    min-width:0;
  }
  .search-box input::placeholder{color:#9aa4b2;}
  .clear-btn{
    border:none;background:var(--paper);color:var(--ink-soft);
    width:30px;height:30px;border-radius:50%;
    display:none;align-items:center;justify-content:center;
    cursor:pointer;flex:none;font-size:1rem;
  }
  .clear-btn.show{display:flex;}

  .meta-row{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:14px 20px 6px;
    font-size:.8rem;
    color:var(--ink-soft);
  }
  .meta-row b{color:var(--navy);}

  /* Offers strip */
  .offers-head{
    display:flex;
    align-items:center;
    gap:6px;
    margin:6px 16px 8px;
    font-size:.9rem;
    font-weight:800;
    color:var(--navy);
  }
  .offers-fire{font-size:1rem;}
  .offers-track{
    display:flex;
    gap:10px;
    overflow-x:auto;
    padding:2px 16px 14px;
    scroll-snap-type:x proximity;
    -webkit-overflow-scrolling:touch;
  }
  .offers-track::-webkit-scrollbar{display:none;}
  .offer-card{
    flex:none;
    width:150px;
    scroll-snap-align:start;
    background:linear-gradient(160deg,#fff8f0,#fff);
    border:1.5px solid #f4d9ae;
    border-radius:14px;
    padding:12px 12px 10px;
    box-shadow:0 3px 10px rgba(232,151,58,.12);
  }
  .offer-badge{
    display:inline-block;
    background:var(--accent);
    color:#fff;
    font-size:.62rem;
    font-weight:800;
    letter-spacing:.4px;
    padding:2px 7px;
    border-radius:5px;
    margin-bottom:7px;
  }
  .offer-name{
    font-size:.78rem;
    font-weight:700;
    color:var(--ink);
    line-height:1.28;
    min-height:2.4em;
    margin:0 0 6px;
    display:-webkit-box;
    -webkit-line-clamp:3;
    -webkit-box-orient:vertical;
    overflow:hidden;
  }
  .offer-price{
    font-size:.92rem;
    font-weight:800;
    color:var(--accent);
    margin-bottom:8px;
  }
  .offer-add{
    width:100%;
    border:none;
    background:var(--navy);
    color:#fff;
    font-size:.75rem;
    font-weight:700;
    padding:8px 6px;
    border-radius:8px;
    cursor:pointer;
  }
  .offer-add.added{
    background:var(--green);
  }

  /* Product list */
  main{
    padding:6px 14px 4px;
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
  }
  .product{
    background:#fff;
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:12px;
    display:flex;
    flex-direction:column;
    align-items:stretch;
    justify-content:space-between;
    gap:10px;
    transition:border-color .15s;
  }
  .product.active{border-color:var(--blue);box-shadow:0 0 0 3px var(--blue-light);}
  .p-info{flex:1;min-width:0;}
  .p-name{
    font-size:.88rem;
    font-weight:600;
    line-height:1.3;
    color:var(--ink);
    margin:0 0 4px;
  }
  .p-price{
    font-size:.92rem;
    color:var(--blue);
    font-weight:700;
  }
  .p-controls{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:0;
    width:100%;
    background:var(--paper);
    border-radius:10px;
    border:1px solid var(--line);
    overflow:hidden;
  }
  .qty-btn{
    flex:1;
    height:36px;
    border:none;
    background:transparent;
    font-size:1.15rem;
    color:var(--navy);
    cursor:pointer;
    display:flex;align-items:center;justify-content:center;
    user-select:none;
    touch-action:manipulation;
  }
  .qty-btn:active{background:var(--line);}
  .qty-val{
    width:38%;
    text-align:center;
    font-size:.95rem;
    font-weight:700;
    color:var(--ink);
    border-left:1px solid var(--line);
    border-right:1px solid var(--line);
    background:#fff;
    padding:0;
    border-top:none;border-bottom:none;
    height:36px;
    -moz-appearance:textfield;
  }
  .qty-val::-webkit-outer-spin-button,
  .qty-val::-webkit-inner-spin-button{-webkit-appearance:none;margin:0;}

  .no-results{
    text-align:center;
    color:var(--ink-soft);
    padding:50px 20px;
    font-size:.92rem;
    grid-column:1 / -1;
  }

  /* Floating cart bar */
  .cart-bar{
    position:fixed;
    left:0;right:0;bottom:0;
    background:#fff;
    border-top:1px solid var(--line);
    box-shadow:0 -6px 24px rgba(15,42,74,.10);
    padding:12px 16px calc(12px + env(safe-area-inset-bottom));
    display:flex;
    align-items:center;
    gap:12px;
    z-index:20;
    transform:translateY(0);
    transition:transform .25s ease;
  }
  .cart-bar.hidden{transform:translateY(110%);}
  .cart-summary{flex:1;min-width:0;}
  .cart-summary .count{
    font-size:.72rem;
    color:var(--ink-soft);
    margin:0 0 1px;
  }
  .cart-summary .total{
    font-size:1.15rem;
    font-weight:800;
    color:var(--navy);
    margin:0;
  }
  .send-btn{
    background:var(--green);
    color:#fff;
    border:none;
    border-radius:12px;
    padding:13px 20px;
    font-size:.95rem;
    font-weight:700;
    display:flex;
    align-items:center;
    gap:8px;
    cursor:pointer;
    flex:none;
    box-shadow:0 4px 12px rgba(37,211,102,.35);
  }
  .send-btn:active{transform:scale(.97);}

  /* Modal */
  .overlay{
    position:fixed;inset:0;
    background:rgba(15,26,43,.5);
    z-index:30;
    display:none;
    align-items:flex-end;
    justify-content:center;
  }
  .overlay.show{display:flex;}
  .modal{
    background:#fff;
    width:100%;
    max-width:520px;
    border-radius:20px 20px 0 0;
    max-height:82vh;
    display:flex;
    flex-direction:column;
    animation:slideUp .25s ease;
  }
  @keyframes slideUp{from{transform:translateY(30px);opacity:0;}to{transform:translateY(0);opacity:1;}}
  .modal-head{
    padding:18px 20px 12px;
    border-bottom:1px solid var(--line);
    display:flex;
    justify-content:space-between;
    align-items:center;
  }
  .modal-head h2{margin:0;font-size:1.1rem;color:var(--navy);}
  .modal-head button{
    border:none;background:var(--paper);
    width:32px;height:32px;border-radius:50%;
    font-size:1rem;color:var(--ink-soft);cursor:pointer;
  }
  .modal-body{
    padding:8px 20px;
    overflow-y:auto;
    flex:1;
  }
  .cart-row{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:12px 0;
    border-bottom:1px solid var(--line);
    gap:10px;
  }
  .cart-row:last-child{border-bottom:none;}
  .cart-row-info{flex:1;min-width:0;}
  .cart-row-name{font-size:.88rem;font-weight:600;}
  .cart-row-sub{font-size:.83rem;color:var(--ink-soft);margin-top:2px;}
  .cart-row-right{
    display:flex;
    flex-direction:column;
    align-items:flex-end;
    gap:6px;
    flex:none;
  }
  .cart-row-price{font-size:.9rem;font-weight:700;color:var(--navy);white-space:nowrap;}
  .cart-row-controls{
    display:flex;
    align-items:center;
    background:var(--paper);
    border-radius:9px;
    border:1px solid var(--line);
    overflow:hidden;
  }
  .cart-qty-btn{
    width:30px;height:30px;
    border:none;
    background:transparent;
    font-size:1rem;
    color:var(--navy);
    cursor:pointer;
    display:flex;align-items:center;justify-content:center;
  }
  .cart-qty-btn:active{background:var(--line);}
  .cart-qty-btn.remove{color:#b3261e;font-size:1.05rem;}
  .cart-qty-val{
    min-width:26px;
    text-align:center;
    font-size:.88rem;
    font-weight:700;
    color:var(--ink);
    border-left:1px solid var(--line);
    border-right:1px solid var(--line);
    padding:0 4px;
    height:30px;
    display:flex;align-items:center;justify-content:center;
  }
  .modal-foot{
    padding:16px 20px calc(16px + env(safe-area-inset-bottom));
    border-top:1px solid var(--line);
  }
  .modal-total-row{
    display:flex;justify-content:space-between;
    font-size:1.15rem;font-weight:800;color:var(--navy);
    margin-bottom:12px;
  }
  .confirm-btn{
    width:100%;
    background:var(--green);
    color:#fff;border:none;border-radius:12px;
    padding:14px;font-size:1rem;font-weight:700;
    display:flex;align-items:center;justify-content:center;gap:8px;
    cursor:pointer;
  }
  .empty-cart{
    text-align:center;color:var(--ink-soft);padding:40px 10px;font-size:.9rem;
  }


  /* Ajuste responsive para celulares de distintos tamaños */
  html{
    width:100%;
    max-width:100%;
    overflow-x:hidden;
    -webkit-text-size-adjust:100%;
    text-size-adjust:100%;
  }
  body{
    width:100%;
    max-width:100%;
    min-width:0;
    overflow-x:hidden;
  }
  header, main, .search-wrap, .meta-row, .offers-head, .cart-bar{
    max-width:100%;
  }
  main{
    width:100%;
    grid-template-columns:repeat(2,minmax(0,1fr));
  }
  .product, .p-info, .p-name, .cart-row, .cart-row-info{
    min-width:0;
    max-width:100%;
  }
  .p-name, .cart-row-name, .offer-name{
    overflow-wrap:anywhere;
    word-break:normal;
  }
  img, iframe{
    max-width:100%;
  }
  .search-box, .p-controls, .cart-row-controls{
    max-width:100%;
  }

  /* En teléfonos muy angostos, una sola columna evita que el navegador
     reduzca automáticamente toda la página para intentar encajarla. */
  @media (max-width:360px){
    main{
      grid-template-columns:1fr;
    }
    .product{
      padding:11px;
    }
  }

  @media (min-width:361px) and (max-width:480px){
    main{
      grid-template-columns:repeat(2,minmax(0,1fr));
      gap:9px;
      padding-left:12px;
      padding-right:12px;
    }
    .product{
      padding:11px;
    }
  }

</style>
</head>

const WHATSAPP_NUMBER = "5493757527231";

let cart = {}; // { index: qty }

function money(n){
  return '$' + n.toLocaleString('es-AR', {maximumFractionDigits:0});
}

function normalize(s){
  return s.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');
}

function renderOffers(){
  const offersSection = document.getElementById('offersSection');
  const track = document.getElementById('offersTrack');
  const offers = [];
  PRODUCTS.forEach((prod, idx) => { if(prod.o) offers.push({ prod, idx }); });

  if(offers.length === 0){
    offersSection.style.display = 'none';
    return;
  }
  offersSection.style.display = 'block';

  track.innerHTML = offers.map(({prod, idx}) => {
    const qty = cart[idx] || 0;
    return `
      <div class="offer-card">
        <span class="offer-badge">OFERTA</span>
        <p class="offer-name">${prod.n}</p>
        <p class="offer-price">${money(prod.p)}</p>
        <button class="offer-add${qty > 0 ? ' added' : ''}" data-idx="${idx}">
          ${qty > 0 ? `✓ En el carrito (${qty})` : '+ Agregar'}
        </button>
      </div>
    `;
  }).join('');

  track.querySelectorAll('.offer-add').forEach(btn => {
    btn.addEventListener('click', () => {
      const idx = Number(btn.dataset.idx);
      addOneFromOffer(idx);
    });
  });
}

function addOneFromOffer(idx){
  const newQty = (cart[idx] || 0) + 1;
  cart[idx] = newQty;
  const row = listEl.querySelector(`.product[data-idx="${idx}"]`);
  if(row){
    const input = row.querySelector('.qty-val');
    if(input) input.value = newQty;
    row.classList.add('active');
  }
  updateCartBar();
  renderOffers();
}

function renderList(filter){
  const q = normalize(filter || '');
  listEl.innerHTML = '';
  let shown = 0;
  PRODUCTS.forEach((prod, idx) => {
    if(q && !normalize(prod.n).includes(q)) return;
    shown++;
    const qty = cart[idx] || 0;
    const row = document.createElement('div');
    row.className = 'product' + (qty > 0 ? ' active' : '');
    row.dataset.idx = idx;
    row.innerHTML = `
      <div class="p-info">
        <p class="p-name">${prod.n}</p>
        <p class="p-price">${money(prod.p)}</p>
      </div>
      <div class="p-controls">
        <button class="qty-btn minus" aria-label="Restar">−</button>
        <input class="qty-val" type="number" min="0" value="${qty}" inputmode="numeric">
        <button class="qty-btn plus" aria-label="Sumar">+</button>
      </div>
    `;
    const minusBtn = row.querySelector('.minus');
    const plusBtn = row.querySelector('.plus');
    const input = row.querySelector('.qty-val');

    minusBtn.addEventListener('click', () => setQty(idx, (cart[idx]||0) - 1, row, input));
    plusBtn.addEventListener('click', () => setQty(idx, (cart[idx]||0) + 1, row, input));
    input.addEventListener('change', () => {
      let v = parseInt(input.value, 10);
      if(isNaN(v) || v < 0) v = 0;
      setQty(idx, v, row, input);
    });

    listEl.appendChild(row);
  });

  resultCount.textContent = filter ? `${shown} resultado${shown===1?'':'s'}` : `${PRODUCTS.length} productos`;
  noResults.style.display = shown === 0 ? 'block' : 'none';
}

function setQty(idx, val, row, input){
  if(val <= 0){
    delete cart[idx];
    val = 0;
  } else {
    cart[idx] = val;
  }
  input.value = val;
  row.classList.toggle('active', val > 0);
  updateCartBar();
  if(PRODUCTS[idx] && PRODUCTS[idx].o) renderOffers();
}

function cartEntries(){
  return Object.entries(cart).map(([idx, qty]) => ({
    idx: Number(idx),
    qty,
    prod: PRODUCTS[idx]
  }));
}

function cartTotalAmount(){
  return cartEntries().reduce((sum, e) => sum + e.prod.p * e.qty, 0);
}

function updateCartBar(){
  const entries = cartEntries();
  const totalItems = entries.reduce((s,e)=>s+e.qty,0);
  const total = cartTotalAmount();
  if(totalItems === 0){
    cartBar.classList.add('hidden');
  } else {
    cartBar.classList.remove('hidden');
    cartCount.textContent = `${totalItems} artículo${totalItems===1?'':'s'}`;
    cartTotal.textContent = money(total);
  }
  if(overlay.classList.contains('show')) renderModal();
}

function renderModal(){
  const entries = cartEntries();
  if(entries.length === 0){
    modalBody.innerHTML = '<div class="empty-cart">Todavía no agregaste productos.</div>';
  } else {
    modalBody.innerHTML = entries.map(e => `
      <div class="cart-row" data-idx="${e.idx}">
        <div class="cart-row-info">
          <div class="cart-row-name">${e.prod.n}</div>
          <div class="cart-row-sub">${money(e.prod.p)} c/u</div>
        </div>
        <div class="cart-row-right">
          <div class="cart-row-price">${money(e.prod.p * e.qty)}</div>
          <div class="cart-row-controls">
            <button class="cart-qty-btn remove" data-action="remove" data-idx="${e.idx}" aria-label="Quitar">🗑</button>
            <button class="cart-qty-btn" data-action="minus" data-idx="${e.idx}" aria-label="Restar">−</button>
            <span class="cart-qty-val">${e.qty}</span>
            <button class="cart-qty-btn" data-action="plus" data-idx="${e.idx}" aria-label="Sumar">+</button>
          </div>
        </div>
      </div>
    `).join('');

    modalBody.querySelectorAll('.cart-qty-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        const idx = Number(btn.dataset.idx);
        const action = btn.dataset.action;
        const current = cart[idx] || 0;
        if(action === 'remove'){
          updateQuantityGlobal(idx, 0);
        } else if(action === 'minus'){
          updateQuantityGlobal(idx, current - 1);
        } else if(action === 'plus'){
          updateQuantityGlobal(idx, current + 1);
        }
      });
    });
  }
  modalTotal.textContent = money(cartTotalAmount());
}

function updateQuantityGlobal(idx, newVal){
  if(newVal <= 0){
    delete cart[idx];
    newVal = 0;
  } else {
    cart[idx] = newVal;
  }
  const row = listEl.querySelector(`.product[data-idx="${idx}"]`);
  if(row){
    const input = row.querySelector('.qty-val');
    if(input) input.value = newVal;
    row.classList.toggle('active', newVal > 0);
  }
  if(PRODUCTS[idx] && PRODUCTS[idx].o) renderOffers();
  updateCartBar();
}

function parseCSV(text){
  const rows = [];
  let row = [], field = '', inQuotes = false;
  for(let i = 0; i < text.length; i++){
    const c = text[i];
    if(inQuotes){
      if(c === '"'){
        if(text[i+1] === '"'){ field += '"'; i++; }
        else inQuotes = false;
      } else field += c;
    } else {
      if(c === '"') inQuotes = true;
      else if(c === ','){ row.push(field); field = ''; }
      else if(c === '\n'){ row.push(field); rows.push(row); row = []; field = ''; }
      else if(c === '\r'){ /* skip */ }
      else field += c;
    }
  }
  if(field.length > 0 || row.length > 0){ row.push(field); rows.push(row); }
  return rows;
}

function parsePrice(raw){
  let s = (raw || '').replace(/[^\d.,\-]/g, '');
  if(!s) return NaN;
  const hasComma = s.includes(',');
  const hasDot = s.includes('.');
  if(hasComma && hasDot){
    const lastComma = s.lastIndexOf(',');
    const lastDot = s.lastIndexOf('.');
    if(lastComma > lastDot){
      s = s.replace(/\./g, '').replace(',', '.');
    } else {
      s = s.replace(/,/g, '');
    }
  } else if(hasComma){
    const parts = s.split(',');
    const lastPart = parts[parts.length - 1];
    if(parts.length > 2 || lastPart.length === 3){
      s = s.replace(/,/g, '');
    } else {
      s = s.replace(',', '.');
    }
  } else if(hasDot){
    const parts = s.split('.');
    const lastPart = parts[parts.length - 1];
    if(parts.length > 2 || lastPart.length === 3){
      s = s.replace(/\./g, '');
    }
  }
  return parseFloat(s);
}

function csvToProducts(text){
  const rows = parseCSV(text).filter(r => r.length >= 2 && r[0] && r[0].trim());
  
  // Extraer el mensaje de aviso desde la celda D1 (fila 0, columna 3)
  const stockBanner = document.getElementById('stockNoticeBanner');
  if(rows[0] && rows[0][3] && rows[0][3].trim().length > 0){
    stockBanner.textContent = rows[0][3].trim();
    stockBanner.style.display = 'block';
  } else {
    stockBanner.style.display = 'none';
  }

  // Omitir fila de encabezados si tiene títulos
  let start = 0;
  if(rows[0] && /producto/i.test(rows[0][0])) start = 1;
  const out = [];
  for(let i = start; i < rows.length; i++){
    const name = (rows[i][0] || '').trim();
    const price = parsePrice(rows[i][1]);
    const offerRaw = (rows[i][2] || '').trim().toLowerCase();
    const isOffer = /^(si|sí|x|1|true|oferta)$/.test(offerRaw);
    if(name && !isNaN(price)){
      out.push({ n: name, p: Math.round(price), o: isOffer });
    }
  }
  return out;
}

function setSyncStatus(ok, detail){
  const el = document.getElementById('syncStatus');
  el.style.display = 'block';
  if(ok){
    el.style.background = '#e8f7ee';
    el.style.color = '#1a7a43';
    const now = new Date();
    const hh = String(now.getHours()).padStart(2,'0');
    const mm = String(now.getMinutes()).padStart(2,'0');
    el.textContent = `✓ Precios actualizados desde la hoja (${hh}:${mm})`;
  } else {
    el.style.background = '#fdeeee';
    el.style.color = '#b3261e';
    el.textContent = `⚠ No se pudo conectar con la hoja de precios ahora mismo. Mostrando la última lista guardada en la página. Detalle: ${detail || 'error de red'}`;
  }
}

async function loadProducts(){
  listEl.innerHTML = '<div class="no-results" style="display:block;">Cargando productos...</div>';
  let lastErr = null;
  for(const base of SHEET_URLS){
    try {
      const url = base + Date.now();
      const res = await fetch(url, { cache: 'no-store' });
      if(!res.ok) throw new Error('HTTP ' + res.status);
      const text = await res.text();
      const parsed = csvToProducts(text);
      if(parsed.length > 0){
        PRODUCTS = parsed;
        setSyncStatus(true);
        renderList(searchInput.value || '');
        renderOffers();
        return;
      }
      throw new Error('La hoja respondió pero no se pudieron leer productos.');
    } catch(err){
      lastErr = err;
      console.error('Intento de carga fallido para', base, err);
    }
  }
  PRODUCTS = FALLBACK_PRODUCTS;
  setSyncStatus(false, lastErr ? lastErr.message : '');
  renderList(searchInput.value || '');
  renderOffers();
}

loadProducts();
</script>


<script>
(function(){
  var openBtn = document.getElementById('openTinturasBtn');
  var overlay = document.getElementById('tintOverlay');
  var closeBtn = document.getElementById('tintCloseBtn');
  var frame = document.getElementById('tintFrame');

  function openTintModal(){
    if(!frame.dataset.loaded){
      var binary = atob(TINTURAS_317_HTML_B64);
      var bytes = new Uint8Array(binary.length);
      for(var i = 0; i < binary.length; i++){ bytes[i] = binary.charCodeAt(i); }
      var html = new TextDecoder('utf-8').decode(bytes);
      frame.srcdoc = html;
      frame.dataset.loaded = '1';
    }
    overlay.classList.add('show');
    document.body.style.overflow = 'hidden';
  }
  function closeTintModal(){
    overlay.classList.remove('show');
    document.body.style.overflow = '';
  }

  openBtn.addEventListener('click', openTintModal);
  closeBtn.addEventListener('click', closeTintModal);
  overlay.addEventListener('click', function(e){
    if(e.target === overlay) closeTintModal();
  });
  window.addEventListener('message', function(e){
    if(e.data === 'cerrarCatalogo317'){ closeTintModal(); }
  });
})();
